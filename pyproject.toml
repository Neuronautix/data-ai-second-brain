[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chu-data-ai-second-brain"
version = "0.1.0"
description = "MVP governance-oriented second brain for healthcare data/AI projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ingestion = [
  "docling>=2.0.0",
  "trafilatura>=1.9.0",
]
ui = [
  "streamlit>=1.36.0",
]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
